name: Capstone CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.11 / Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip check

      - name: Validate Jupyter notebook syntax & schemas
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat

          notebooks = sorted(Path(".").glob("capstone_*/notebooks/*.ipynb"))
          if not notebooks:
              raise SystemExit("No capstone notebooks found to validate")

          for path in notebooks:
              notebook = nbformat.read(path, as_version=4)
              nbformat.validate(notebook)
              print(f"VALID: {path}")
          PY

      - name: Run automated regression and invariant tests
        run: python -m pytest -v tests/
